<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朝読み — オンライン読書会 進行ツール</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">朝読み</h1>
    <div class="header-actions">
      <button id="btn-history" class="ghost-btn" title="これまでの記録">📖 履歴</button>
      <button id="btn-data" class="ghost-btn" title="データ管理">⚙︎ データ管理</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- データ管理モーダル -->
  <div id="data-modal" class="modal hidden">
    <div class="modal-body">
      <h2>データ管理</h2>

      <label class="switch-row">
        <span>
          <span class="switch-title">ひとりで使う</span>
          <span class="switch-note">感想シェアを省略し、自分用のメモだけ記録します</span>
        </span>
        <input type="checkbox" id="solo-toggle" class="switch" />
      </label>

      <div class="modal-actions">
        <button id="btn-export" class="primary-btn">設定と履歴の保存</button>
        <label class="primary-btn file-label">
          設定と履歴の読込
          <input id="file-import" type="file" accept="application/json" hidden />
        </label>
      </div>

      <p class="import-caution">
        🔒 <strong>自分で書き出して保管したバックアップのみ</strong>読み込んでください。
        出所が不明なものや、第三者が編集したファイルは、読書記録の漏えい・改変に
        つながるおそれがあります。
      </p>

      <div class="modal-actions">
        <button id="btn-edit-participants" class="secondary-btn">参加者を編集</button>
        <button id="btn-switch-book" class="secondary-btn">本を切り替える</button>
        <button id="btn-edit-book" class="secondary-btn">本を編集</button>
      </div>

      <div class="rest-days">
        <p class="rest-days-title">読書会お休みの日</p>
        <p class="rest-days-note">連続開催のカウント対象外です</p>
        <div class="weekday-checks" id="weekday-checks"></div>
      </div>

      <button id="btn-close-modal" class="ghost-btn close-btn">閉じる</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
